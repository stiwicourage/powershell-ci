name: Publish module (reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label.
        type: string
        default: ubuntu-latest
      dependency-mode:
        description: legacy installs CurrentUser; isolated uses owned disposable dependencies.
        type: string
        default: legacy
      pester-required-version:
        description: Exact Pester version saved in isolated mode; empty preserves defaults.
        type: string
        default: ''
      release-branch:
        description: Branch that produces stable releases.
        type: string
        default: main
      develop-branch:
        description: Branch that produces prereleases.
        type: string
        default: develop
      repository:
        description: PSResource repository to publish to.
        type: string
        default: PSGallery
      install-command:
        description: PowerShell command that installs CI modules; replaces install-modules when set.
        type: string
        default: ''
      install-modules:
        description: Space separated modules installed with the shared install-ps-modules action, in addition to project.json Manifest.RequiredModules.
        type: string
        default: NovaModuleTools KeepAChangelog
      build-command:
        description: PowerShell command that builds the module.
        type: string
        default: Invoke-NovaBuild -ContinuousIntegration
      test-command:
        description: PowerShell command that runs the built-module tests. Use Test-NovaBuild for projects whose build-validation tests are self-contained.
        type: string
        default: Invoke-NovaTest
      release-continuous-integration:
        description: Pass -ContinuousIntegration to Invoke-NovaRelease.
        type: boolean
        default: false
    secrets:
      PSGALLERY_API:
        description: API key for the PSResource repository.
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  publish:
    permissions:
      contents: write
      actions: write
    if: >-
      ${{
        github.event_name != 'push' ||
        !startsWith(github.event.head_commit.message || '', 'chore(release): ')
      }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check out powershell-ci actions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .powershell-ci
          sparse-checkout: actions
          persist-credentials: false

      - name: Keep powershell-ci actions out of project changes
        run: Add-Content -LiteralPath (Join-Path (git rev-parse --git-dir) "info/exclude") -Value "/.powershell-ci/"

      - name: Validate dependency mode
        env:
          DEPENDENCY_MODE: ${{ inputs.dependency-mode }}
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: |
          if ($env:DEPENDENCY_MODE -notin @('legacy', 'isolated')) {
            throw 'Unsupported dependency-mode.'
          }
          if ($env:DEPENDENCY_MODE -eq 'isolated' -and $env:INSTALL_COMMAND) {
            throw 'isolated mode cannot use install-command; use the shared owned installer.'
          }

      - name: Install required modules
        id: ci_modules
        if: ${{ inputs.install-command == '' }}
        uses: ./.powershell-ci/actions/install-ps-modules
        with:
          modules: ${{ inputs.install-modules }}
          dependency-mode: ${{ inputs.dependency-mode }}
          pester-required-version: ${{ inputs.pester-required-version }}

      - name: Install required modules (custom command)
        if: ${{ inputs.install-command != '' }}
        run: ${{ inputs.install-command }}

      - name: Build module
        env:
          PESTER_REQUIRED_VERSION: ${{ inputs.pester-required-version }}
        run: |
          if ($env:POWERSHELL_CI_BOOTSTRAP) {
            . $env:POWERSHELL_CI_BOOTSTRAP
            Initialize-CiDependencyEnvironment
          }
          if ($env:PESTER_REQUIRED_VERSION) {
            Import-Module Pester -RequiredVersion $env:PESTER_REQUIRED_VERSION -ErrorAction Stop
          }
          ${{ inputs.build-command }}

      - name: Run Pester tests
        env:
          PESTER_REQUIRED_VERSION: ${{ inputs.pester-required-version }}
        run: |
          if ($env:POWERSHELL_CI_BOOTSTRAP) {
            . $env:POWERSHELL_CI_BOOTSTRAP
            Initialize-CiDependencyEnvironment
          }
          if ($env:PESTER_REQUIRED_VERSION) {
            Import-Module Pester -RequiredVersion $env:PESTER_REQUIRED_VERSION -ErrorAction Stop
          }
          ${{ inputs.test-command }}

      - name: Generate report
        continue-on-error: true
        run: |
          if ($env:POWERSHELL_CI_BOOTSTRAP) {
            . $env:POWERSHELL_CI_BOOTSTRAP
            Initialize-CiDependencyEnvironment
          }
          $reportLines = @('## Output Files', '')
          $files = Get-ChildItem -Path ./dist -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName
          if ($files) {
            $reportLines += '| Name | Directory |'
            $reportLines += '| --- | --- |'
            $reportLines += $files | ForEach-Object {
              "| $(('' + $_.Name).Replace('|', '\|')) | $(('' + $_.Directory).Replace('|', '\|')) |"
            }
          }
          else {
            $reportLines += 'No files found in `./dist`.'
          }
          $report = $reportLines -join [Environment]::NewLine
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $report
          Write-Output $report

      - name: Ensure PSResource repository registration
        if: ${{ github.ref_name == inputs.release-branch || github.ref_name == inputs.develop-branch }}
        uses: ./.powershell-ci/actions/ensure-psresource-repository

      - name: Run release
        id: release
        if: ${{ github.ref_name == inputs.release-branch }}
        env:
          PSGALLERY_API: ${{ secrets.PSGALLERY_API }}
          RELEASE_REPOSITORY: ${{ inputs.repository }}
          RELEASE_CI: ${{ inputs.release-continuous-integration }}
        run: |
          if ($env:POWERSHELL_CI_BOOTSTRAP) {
            . $env:POWERSHELL_CI_BOOTSTRAP
            Initialize-CiDependencyEnvironment
          }
          $releaseArguments = @{
            Repository = $env:RELEASE_REPOSITORY
            ApiKey = $env:PSGALLERY_API
            SkipTests = $true
          }
          if ($env:RELEASE_CI -eq 'true') { $releaseArguments.ContinuousIntegration = $true }
          Invoke-NovaRelease @releaseArguments
          $version = Get-NovaProjectInfo -Version
          $result = Move-UnreleasedChangelog -Version $version
          $notesPath = ''
          if (Test-Path -LiteralPath ./RELEASE_NOTE.md) {
            $releaseNote = Move-UnreleasedChangelog -Path ./RELEASE_NOTE.md -Version $version
            $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
            Set-Content -LiteralPath $notesPath -Value $releaseNote.ReleaseNotesBody -Encoding utf8
          }
          # KeepAChangelog 0.3.0 and earlier write an extra blank line at the end of the promoted file.
          foreach ($file in @('./CHANGELOG.md', './RELEASE_NOTE.md') | Where-Object { Test-Path -LiteralPath $_ }) {
            $text = [System.IO.File]::ReadAllText((Resolve-Path -LiteralPath $file)).TrimEnd() + "`n"
            [System.IO.File]::WriteAllText((Resolve-Path -LiteralPath $file), $text)
          }

          "release_version=$version" >> $env:GITHUB_OUTPUT
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

          $delimiter = [guid]::NewGuid().Guid
          "tag_message<<$delimiter" >> $env:GITHUB_OUTPUT
          $result.TagMessageText >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT

      - name: Create verified release commit
        id: commit_release
        if: ${{ github.ref_name == inputs.release-branch }}
        uses: ./.powershell-ci/actions/create-verified-commit
        with:
          base-ref: ${{ inputs.release-branch }}
          commit-message: 'chore(release): ${{ steps.release.outputs.release_version }}'

      - name: Push verified release commit
        if: ${{ github.ref_name == inputs.release-branch && steps.commit_release.outputs.has-changes == 'true' }}
        uses: ./.powershell-ci/actions/update-git-ref
        with:
          ref: refs/heads/${{ inputs.release-branch }}
          sha: ${{ steps.commit_release.outputs.commit-sha }}

      - name: Create annotated release tag
        if: ${{ github.ref_name == inputs.release-branch && steps.commit_release.outputs.has-changes == 'true' }}
        uses: ./.powershell-ci/actions/create-annotated-tag
        with:
          tag-name: ${{ steps.release.outputs.release_version }}
          target-sha: ${{ steps.commit_release.outputs.commit-sha }}
          message: ${{ steps.release.outputs.tag_message }}

      - name: Create GitHub release
        if: ${{ github.ref_name == inputs.release-branch && steps.commit_release.outputs.has-changes == 'true' }}
        uses: ./.powershell-ci/actions/create-github-release
        with:
          tag-name: ${{ steps.release.outputs.release_version }}
          notes-file: ${{ steps.release.outputs.notes_path }}

      - name: Prepare next prerelease version on release branch to develop
        if: ${{ github.ref_name == inputs.release-branch && steps.commit_release.outputs.has-changes == 'true' }}
        env:
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          DEVELOP_BRANCH: ${{ inputs.develop-branch }}
        run: |
          if ($env:POWERSHELL_CI_BOOTSTRAP) {
            . $env:POWERSHELL_CI_BOOTSTRAP
            Initialize-CiDependencyEnvironment
          }
          git fetch origin $env:RELEASE_BRANCH
          git fetch origin $env:DEVELOP_BRANCH

          git checkout $env:DEVELOP_BRANCH
          git reset --hard "origin/$env:RELEASE_BRANCH"

          Update-NovaModuleVersion -Preview -ContinuousIntegration

      - name: Create verified develop prerelease commit
        id: commit_develop_from_release
        if: ${{ github.ref_name == inputs.release-branch && steps.commit_release.outputs.has-changes == 'true' }}
        uses: ./.powershell-ci/actions/create-verified-commit
        with:
          base-ref: ${{ inputs.release-branch }}
          commit-message: 'chore: prepare develop for next prerelease'

      - name: Push verified develop prerelease commit
        if: ${{ github.ref_name == inputs.release-branch && steps.commit_develop_from_release.outputs.has-changes == 'true' }}
        uses: ./.powershell-ci/actions/update-git-ref
        with:
          ref: refs/heads/${{ inputs.develop-branch }}
          sha: ${{ steps.commit_develop_from_release.outputs.commit-sha }}
          force: 'true'

      - name: Check out develop branch
        if: ${{ github.ref_name == inputs.develop-branch }}
        env:
          DEVELOP_BRANCH: ${{ inputs.develop-branch }}
        run: |
          if ($env:POWERSHELL_CI_BOOTSTRAP) {
            . $env:POWERSHELL_CI_BOOTSTRAP
            Initialize-CiDependencyEnvironment
          }
          $ErrorActionPreference = 'Stop'
          git fetch origin $env:DEVELOP_BRANCH
          git checkout $env:DEVELOP_BRANCH

      - name: Publish develop prerelease
        if: ${{ github.ref_name == inputs.develop-branch }}
        env:
          PSGALLERY_API: ${{ secrets.PSGALLERY_API }}
          RELEASE_REPOSITORY: ${{ inputs.repository }}
        run: |
          if ($env:POWERSHELL_CI_BOOTSTRAP) {
            . $env:POWERSHELL_CI_BOOTSTRAP
            Initialize-CiDependencyEnvironment
          }
          Publish-NovaModule -Repository $env:RELEASE_REPOSITORY -ApiKey $env:PSGALLERY_API -SkipTests -ContinuousIntegration

      - name: Bump next prerelease version on develop
        if: ${{ github.ref_name == inputs.develop-branch }}
        run: |
          if ($env:POWERSHELL_CI_BOOTSTRAP) {
            . $env:POWERSHELL_CI_BOOTSTRAP
            Initialize-CiDependencyEnvironment
          }
          Update-NovaModuleVersion -Preview -ContinuousIntegration

      - name: Create verified develop commit
        id: commit_develop
        if: ${{ github.ref_name == inputs.develop-branch }}
        uses: ./.powershell-ci/actions/create-verified-commit
        with:
          base-ref: ${{ inputs.develop-branch }}
          commit-message: 'chore: prepare next prerelease version'

      - name: Push verified develop commit
        if: ${{ github.ref_name == inputs.develop-branch && steps.commit_develop.outputs.has-changes == 'true' }}
        uses: ./.powershell-ci/actions/update-git-ref
        with:
          ref: refs/heads/${{ inputs.develop-branch }}
          sha: ${{ steps.commit_develop.outputs.commit-sha }}

      - name: Cleanup owned CI modules
        if: ${{ always() && steps.ci_modules.outputs.module-root != '' }}
        uses: ./.powershell-ci/actions/cleanup-ps-modules
        with:
          module-root: ${{ steps.ci_modules.outputs.module-root }}
