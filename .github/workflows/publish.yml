name: Publish module (reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label.
        type: string
        default: ubuntu-latest
      release-branch:
        description: Branch that produces stable releases.
        type: string
        default: main
      develop-branch:
        description: Branch that produces prereleases.
        type: string
        default: develop
      repository:
        description: PSResource repository to publish to.
        type: string
        default: PSGallery
      install-command:
        description: PowerShell command that installs CI modules. Empty skips the step.
        type: string
        default: ./scripts/build/ci/Install-CiPowerShellModules.ps1
      build-command:
        description: PowerShell command that builds the module.
        type: string
        default: Invoke-NovaBuild -ContinuousIntegration
      test-command:
        description: PowerShell command that runs the built-module tests.
        type: string
        default: Test-NovaBuild
      release-continuous-integration:
        description: Pass -ContinuousIntegration to Invoke-NovaRelease.
        type: boolean
        default: false
    secrets:
      PSGALLERY_API:
        description: API key for the PSResource repository.
        required: true

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  publish:
    if: >-
      ${{
        github.event_name != 'push' ||
        !startsWith(github.event.head_commit.message || '', 'chore(release): ')
      }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install required modules
        if: ${{ inputs.install-command != '' }}
        run: ${{ inputs.install-command }}

      - name: Build module
        run: ${{ inputs.build-command }}

      - name: Run Pester tests
        run: ${{ inputs.test-command }}

      - name: Generate report
        continue-on-error: true
        run: |
          $reportLines = @('## Output Files', '')
          $files = Get-ChildItem -Path ./dist -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName
          if ($files) {
            $reportLines += '| Name | Directory |'
            $reportLines += '| --- | --- |'
            $reportLines += $files | ForEach-Object {
              "| $(('' + $_.Name).Replace('|', '\|')) | $(('' + $_.Directory).Replace('|', '\|')) |"
            }
          }
          else {
            $reportLines += 'No files found in `./dist`.'
          }
          $report = $reportLines -join [Environment]::NewLine
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $report
          Write-Output $report

      - name: Ensure PSResource repository registration
        if: ${{ github.ref_name == inputs.release-branch || github.ref_name == inputs.develop-branch }}
        uses: stiwicourage/powershell-ci/actions/ensure-psresource-repository@develop

      - name: Run release
        id: release
        if: ${{ github.ref_name == inputs.release-branch }}
        env:
          PSGALLERY_API: ${{ secrets.PSGALLERY_API }}
          RELEASE_REPOSITORY: ${{ inputs.repository }}
          RELEASE_CI: ${{ inputs.release-continuous-integration }}
        run: |
          $releaseArguments = @{
            Repository = $env:RELEASE_REPOSITORY
            ApiKey = $env:PSGALLERY_API
            SkipTests = $true
          }
          if ($env:RELEASE_CI -eq 'true') { $releaseArguments.ContinuousIntegration = $true }
          Invoke-NovaRelease @releaseArguments
          $version = Get-NovaProjectInfo -Version
          $result = Move-UnreleasedChangelog -Version $version
          Move-UnreleasedChangelog -Path ./RELEASE_NOTE.md -Version $version | Out-Null

          "release_version=$version" >> $env:GITHUB_OUTPUT

          $delimiter = [guid]::NewGuid().Guid
          "tag_message<<$delimiter" >> $env:GITHUB_OUTPUT
          $result.TagMessageText >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT

      - name: Create verified release commit
        id: commit_release
        if: ${{ github.ref_name == inputs.release-branch }}
        uses: stiwicourage/powershell-ci/actions/create-verified-commit@develop
        with:
          base-ref: ${{ inputs.release-branch }}
          commit-message: 'chore(release): ${{ steps.release.outputs.release_version }}'

      - name: Push verified release commit
        if: ${{ github.ref_name == inputs.release-branch && steps.commit_release.outputs.has-changes == 'true' }}
        uses: stiwicourage/powershell-ci/actions/update-git-ref@develop
        with:
          ref: refs/heads/${{ inputs.release-branch }}
          sha: ${{ steps.commit_release.outputs.commit-sha }}

      - name: Create annotated release tag
        if: ${{ github.ref_name == inputs.release-branch && steps.commit_release.outputs.has-changes == 'true' }}
        uses: stiwicourage/powershell-ci/actions/create-annotated-tag@develop
        with:
          tag-name: ${{ steps.release.outputs.release_version }}
          target-sha: ${{ steps.commit_release.outputs.commit-sha }}
          message: ${{ steps.release.outputs.tag_message }}

      - name: Prepare next prerelease version on release branch to develop
        if: ${{ github.ref_name == inputs.release-branch && steps.commit_release.outputs.has-changes == 'true' }}
        env:
          RELEASE_BRANCH: ${{ inputs.release-branch }}
          DEVELOP_BRANCH: ${{ inputs.develop-branch }}
        run: |
          git fetch origin $env:RELEASE_BRANCH
          git fetch origin $env:DEVELOP_BRANCH

          git checkout $env:DEVELOP_BRANCH
          git reset --hard "origin/$env:RELEASE_BRANCH"

          Update-NovaModuleVersion -Preview -ContinuousIntegration

      - name: Create verified develop prerelease commit
        id: commit_develop_from_release
        if: ${{ github.ref_name == inputs.release-branch && steps.commit_release.outputs.has-changes == 'true' }}
        uses: stiwicourage/powershell-ci/actions/create-verified-commit@develop
        with:
          base-ref: ${{ inputs.release-branch }}
          commit-message: 'chore: prepare develop for next prerelease'

      - name: Push verified develop prerelease commit
        if: ${{ github.ref_name == inputs.release-branch && steps.commit_develop_from_release.outputs.has-changes == 'true' }}
        uses: stiwicourage/powershell-ci/actions/update-git-ref@develop
        with:
          ref: refs/heads/${{ inputs.develop-branch }}
          sha: ${{ steps.commit_develop_from_release.outputs.commit-sha }}
          force: 'true'

      - name: Check out develop branch
        if: ${{ github.ref_name == inputs.develop-branch }}
        env:
          DEVELOP_BRANCH: ${{ inputs.develop-branch }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin $env:DEVELOP_BRANCH
          git checkout $env:DEVELOP_BRANCH

      - name: Publish develop prerelease
        if: ${{ github.ref_name == inputs.develop-branch }}
        env:
          PSGALLERY_API: ${{ secrets.PSGALLERY_API }}
          RELEASE_REPOSITORY: ${{ inputs.repository }}
        run: |
          Publish-NovaModule -Repository $env:RELEASE_REPOSITORY -ApiKey $env:PSGALLERY_API -SkipTests -ContinuousIntegration

      - name: Bump next prerelease version on develop
        if: ${{ github.ref_name == inputs.develop-branch }}
        run: |
          Update-NovaModuleVersion -Preview -ContinuousIntegration

      - name: Create verified develop commit
        id: commit_develop
        if: ${{ github.ref_name == inputs.develop-branch }}
        uses: stiwicourage/powershell-ci/actions/create-verified-commit@develop
        with:
          base-ref: ${{ inputs.develop-branch }}
          commit-message: 'chore: prepare next prerelease version'

      - name: Push verified develop commit
        if: ${{ github.ref_name == inputs.develop-branch && steps.commit_develop.outputs.has-changes == 'true' }}
        uses: stiwicourage/powershell-ci/actions/update-git-ref@develop
        with:
          ref: refs/heads/${{ inputs.develop-branch }}
          sha: ${{ steps.commit_develop.outputs.commit-sha }}
