name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify workflows are pinned to the release tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $pattern = 'stiwicourage/powershell-ci/[^\s@]+@(\S+)'
          $unpinned = Get-ChildItem .github/workflows -Filter '*.yml' |
            Select-String -Pattern $pattern |
            Where-Object { $_.Matches[0].Groups[1].Value -ne $env:TAG }
          if ($unpinned) {
            $unpinned | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber) is not pinned to $env:TAG" }
            throw "Run scripts/Set-InternalActionRefs.ps1 -Ref $env:TAG before tagging."
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $prerelease = if ($env:TAG -match '-') { '--prerelease' } else { $null }
          gh release create $env:TAG --title $env:TAG --generate-notes $prerelease
