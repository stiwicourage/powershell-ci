name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  release:
    permissions:
      contents: write
      actions: write
      id-token: write
    if: >-
      ${{
        github.event_name != 'push' ||
        !startsWith(github.event.head_commit.message || '', 'chore(release): ')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install release tooling
        uses: ./actions/install-ps-modules
        with:
          modules: SemanticRelease KeepAChangelog

      - name: Determine next version from Conventional Commits
        id: version
        run: |
          git fetch --tags --quiet
          $commitCount = @(Get-SemanticReleaseCommitMessage -ProjectRoot .).Count
          $result = Update-SemanticReleaseVersion -Path ./version.json -ProjectRoot . -Confirm:$false
          $version = $result.NewVersion
          $needsRelease = $commitCount -gt 0 -and -not [bool](git tag --list $version)

          "version=$version" >> $env:GITHUB_OUTPUT
          "needs_release=$($needsRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $needsRelease) {
            Write-Output "No new commits since the last tag or tag $version exists; nothing to release."
            git checkout -- version.json
          }

      - name: Promote unreleased changelog and release notes
        id: notes
        if: ${{ steps.version.outputs.needs_release == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $result = ./scripts/Move-ReleaseNotes.ps1 -Version $env:VERSION -ReleaseNotesPath $notesPath

          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT
          $delimiter = [guid]::NewGuid().Guid
          "tag_message<<$delimiter" >> $env:GITHUB_OUTPUT
          $result.TagMessage >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT

      - name: Pin examples to the release version
        if: ${{ steps.version.outputs.needs_release == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Set-InternalActionRefs.ps1 -Ref $env:VERSION -Path ./examples

      - name: Create verified release commit
        id: commit_release
        if: ${{ steps.version.outputs.needs_release == 'true' }}
        uses: ./actions/create-verified-commit
        with:
          base-ref: main
          commit-message: 'chore(release): ${{ steps.version.outputs.version }}'

      - name: Create release app token
        id: app_token
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Push verified release commit
        if: ${{ steps.version.outputs.needs_release == 'true' && steps.commit_release.outputs.has-changes == 'true' }}
        uses: ./actions/update-git-ref
        with:
          ref: refs/heads/main
          sha: ${{ steps.commit_release.outputs.commit-sha }}
          token: ${{ steps.app_token.outputs.token || github.token }}

      - name: Create annotated release tag
        if: ${{ steps.version.outputs.needs_release == 'true' }}
        uses: ./actions/create-annotated-tag
        with:
          tag-name: ${{ steps.version.outputs.version }}
          target-sha: ${{ steps.commit_release.outputs.has-changes == 'true' && steps.commit_release.outputs.commit-sha || github.sha }}
          message: ${{ steps.notes.outputs.tag_message }}

      - name: Prepare develop for the next prerelease version
        id: prepare_develop
        if: ${{ steps.version.outputs.needs_release == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git fetch origin main develop
          git checkout develop
          git reset --hard '${{ steps.commit_release.outputs.has-changes == 'true' && steps.commit_release.outputs.commit-sha || github.sha }}'

          $next = Get-SemanticReleaseNextVersion -CurrentVersion ([semver]$env:VERSION) -Label Patch -Preview
          [ordered]@{ Version = "$($next.NewVersion)" } | ConvertTo-Json | Set-Content ./version.json

      - name: Create verified develop commit
        id: commit_develop
        if: ${{ steps.version.outputs.needs_release == 'true' }}
        uses: ./actions/create-verified-commit
        with:
          base-ref: main
          commit-message: 'chore: prepare develop for next prerelease'

      - name: Push verified develop commit
        if: ${{ steps.version.outputs.needs_release == 'true' && steps.commit_develop.outputs.has-changes == 'true' }}
        uses: ./actions/update-git-ref
        with:
          ref: refs/heads/develop
          sha: ${{ steps.commit_develop.outputs.commit-sha }}
          token: ${{ steps.app_token.outputs.token || github.token }}
          force: 'true'

      - name: Package release assets
        id: package
        if: ${{ steps.version.outputs.needs_release == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.commit_release.outputs.has-changes == 'true' && steps.commit_release.outputs.commit-sha || github.sha }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "powershell-ci-$env:VERSION.zip"
          git archive --format=zip --prefix="powershell-ci-$env:VERSION/" -o $archive $env:RELEASE_SHA actions .github/workflows examples
          if ($LASTEXITCODE -ne 0) { throw "git archive failed for $env:RELEASE_SHA." }
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Install cosign
        if: ${{ steps.version.outputs.needs_release == 'true' }}
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign release assets
        id: sign
        if: ${{ steps.version.outputs.needs_release == 'true' }}
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          $bundle = "$env:ARCHIVE.sigstore.json"
          cosign sign-blob --yes --bundle $bundle $env:ARCHIVE
          if ($LASTEXITCODE -ne 0) { throw "cosign could not sign $env:ARCHIVE." }
          "bundle=$bundle" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        if: ${{ steps.version.outputs.needs_release == 'true' }}
        uses: ./actions/create-github-release
        with:
          tag-name: ${{ steps.version.outputs.version }}
          notes-file: ${{ steps.notes.outputs.notes_path }}
          assets: ${{ steps.package.outputs.archive }} ${{ steps.sign.outputs.bundle }}
