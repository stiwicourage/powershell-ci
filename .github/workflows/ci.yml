name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  pester:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install PSScriptAnalyzer and Pester
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer, Pester -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Pester tests
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Minimal'
          Invoke-Pester -Configuration $config

  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install KeepAChangelog
        uses: ./actions/install-ps-modules
        with:
          modules: KeepAChangelog

      - name: Require [Unreleased] entries before release
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        uses: ./actions/check-unreleased-entries
        with:
          files: ./CHANGELOG.md ./RELEASE_NOTE.md

      - name: Validate CHANGELOG.md and RELEASE_NOTE.md
        run: |
          foreach ($path in './CHANGELOG.md', './RELEASE_NOTE.md') {
            Test-KeepAChangelogFile -Path $path -ThrowOnError | Out-Null
            Write-Output "$path follows Keep a Changelog."
          }

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lint workflows
        shell: bash
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
