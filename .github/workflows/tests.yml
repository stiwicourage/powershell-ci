name: Tests (reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for all jobs.
        type: string
        default: ubuntu-latest
      dependency-mode:
        description: legacy installs CurrentUser; isolated uses owned disposable dependencies.
        type: string
        default: legacy
      pester-required-version:
        description: Exact opt-in Pester version; empty preserves project defaults.
        type: string
        default: ''
      install-command:
        description: PowerShell command that installs CI modules; replaces install-modules when set.
        type: string
        default: ''
      install-modules:
        description: Space separated modules installed with the shared install-ps-modules action, in addition to project.json Manifest.RequiredModules.
        type: string
        default: NovaModuleTools KeepAChangelog PSScriptAnalyzer
      script-analyzer-enabled:
        description: Run the shared PSScriptAnalyzer gate before the tests.
        type: boolean
        default: true
      script-analyzer-paths:
        description: Space separated project-relative paths analyzed by PSScriptAnalyzer.
        type: string
        default: src scripts tests run.ps1
      script-analyzer-required-version:
        description: Exact PSScriptAnalyzer version required. Empty accepts any installed version.
        type: string
        default: ''
      script-analyzer-severity:
        description: Space separated PSScriptAnalyzer severities that fail the gate, for example Error Warning ParseError. Empty fails on every severity.
        type: string
        default: ''
      build-validation:
        description: Also run Test-NovaBuild after Invoke-NovaTest. Ignored when test-command is set.
        type: boolean
        default: true
      test-isolation:
        description: session runs Nova tests in the runner session; process runs each Nova test command in a fresh PowerShell process. Ignored when test-command is set.
        type: string
        default: session
      test-command:
        description: Optional PowerShell command that replaces the shared nova-test action. It must write artifacts/coverage.xml.
        type: string
        default: ''
      changelog-files:
        description: Space separated changelog files validated with Test-KeepAChangelogFile. Empty skips the step.
        type: string
        default: ./CHANGELOG.md
      release-branch:
        description: Branch that produces stable releases. Pull requests into it must have entries under [Unreleased] in changelog-files.
        type: string
        default: main
      artifact-name:
        description: Name of the uploaded CI artifact bundle.
        type: string
        default: ci-artifacts
      artifact-paths:
        description: Newline separated paths uploaded as CI artifacts.
        type: string
        default: |
          artifacts/
          dist/
      coverage-files:
        description: Glob matching coverage reports checked by CodeScene.
        type: string
        default: '**/coverage.xml'
      codescene-enabled:
        description: Run CodeScene coverage gates and analysis.
        type: boolean
        default: true
      codescene-analysis-branch:
        description: Branch whose pushes trigger CodeScene analysis.
        type: string
        default: develop
      codescene-analysis-command:
        description: Optional PowerShell command that replaces the shared codescene-analysis action.
        type: string
        default: ''
    secrets:
      CS_ACCESS_TOKEN:
        description: CodeScene access token. Required when codescene-enabled is true.
        required: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: pwsh

jobs:
  test-and-coverage:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out powershell-ci actions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .powershell-ci
          sparse-checkout: actions
          persist-credentials: false

      - name: Keep powershell-ci actions out of project changes
        run: Add-Content -LiteralPath (Join-Path (git rev-parse --git-dir) "info/exclude") -Value "/.powershell-ci/"

      - name: Validate dependency mode
        env:
          DEPENDENCY_MODE: ${{ inputs.dependency-mode }}
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: |
          if ($env:DEPENDENCY_MODE -notin @('legacy', 'isolated')) {
            throw 'Unsupported dependency-mode.'
          }
          if ($env:DEPENDENCY_MODE -eq 'isolated' -and $env:INSTALL_COMMAND) {
            throw 'isolated mode cannot use install-command; use the shared owned installer.'
          }

      - name: Install required CI PowerShell modules
        id: ci_modules
        if: ${{ inputs.install-command == '' }}
        uses: ./.powershell-ci/actions/install-ps-modules
        with:
          modules: ${{ inputs.install-modules }}
          dependency-mode: ${{ inputs.dependency-mode }}
          pester-required-version: ${{ inputs.pester-required-version }}
          script-analyzer-required-version: ${{ inputs.script-analyzer-required-version }}

      - name: Install required CI PowerShell modules (custom command)
        if: ${{ inputs.install-command != '' }}
        run: ${{ inputs.install-command }}

      - name: Run PSScriptAnalyzer
        if: ${{ inputs.script-analyzer-enabled }}
        uses: ./.powershell-ci/actions/script-analyzer
        with:
          analysis-paths: ${{ inputs.script-analyzer-paths }}
          required-version: ${{ inputs.script-analyzer-required-version }}
          severity: ${{ inputs.script-analyzer-severity }}

      - name: Run CI tests and coverage
        if: ${{ inputs.test-command == '' }}
        uses: ./.powershell-ci/actions/nova-test
        with:
          build-validation: ${{ inputs.build-validation }}
          pester-required-version: ${{ inputs.pester-required-version }}
          test-isolation: ${{ inputs.test-isolation }}

      - name: Run CI tests and coverage (custom command)
        if: ${{ inputs.test-command != '' }}
        env:
          PESTER_REQUIRED_VERSION: ${{ inputs.pester-required-version }}
        run: |
          if ($env:POWERSHELL_CI_BOOTSTRAP) {
            . $env:POWERSHELL_CI_BOOTSTRAP
            Initialize-CiDependencyEnvironment
          }
          if ($env:PESTER_REQUIRED_VERSION) {
            Import-Module Pester -RequiredVersion $env:PESTER_REQUIRED_VERSION -ErrorAction Stop
          }
          ${{ inputs.test-command }}

      - name: Validate changelog files with Test-KeepAChangelogFile
        if: ${{ inputs.changelog-files != '' }}
        env:
          CHANGELOG_FILES: ${{ inputs.changelog-files }}
        run: |
          if ($env:POWERSHELL_CI_BOOTSTRAP) {
            . $env:POWERSHELL_CI_BOOTSTRAP
            Initialize-CiDependencyEnvironment
          }
          foreach ($path in $env:CHANGELOG_FILES -split '\s+' | Where-Object { $_ }) {
            $result = Test-KeepAChangelogFile -Path $path
            if (-not $result.IsValid) {
              $errors = $result.Errors -join [Environment]::NewLine
              throw "Validation failed for $path$([Environment]::NewLine)$errors"
            }
          }

      - name: Require [Unreleased] entries before release
        if: ${{ inputs.changelog-files != '' && github.event_name == 'pull_request' && github.base_ref == inputs.release-branch }}
        uses: ./.powershell-ci/actions/check-unreleased-entries
        with:
          files: ${{ inputs.changelog-files }}

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-name }}
          if-no-files-found: warn
          path: ${{ inputs.artifact-paths }}

      - name: Generate report
        if: always()
        run: |
          if ($env:POWERSHELL_CI_BOOTSTRAP) {
            . $env:POWERSHELL_CI_BOOTSTRAP
            Initialize-CiDependencyEnvironment
          }
          $reportLines = @('## CI Output Files')
          foreach ($directory in @('./artifacts', './dist')) {
            $reportLines += @('', "### $directory", '')
            $files = Get-ChildItem -Path $directory -Recurse -File -ErrorAction SilentlyContinue | Sort-Object FullName
            if ($files) {
              $reportLines += '| Name | Directory |'
              $reportLines += '| --- | --- |'
              $reportLines += $files | ForEach-Object {
                "| $(('' + $_.Name).Replace('|', '\|')) | $(('' + $_.Directory).Replace('|', '\|')) |"
              }
            }
            else {
              $reportLines += "No files found in ``$directory``."
            }
          }
          $report = $reportLines -join [Environment]::NewLine
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $report
          Write-Output $report

      - name: Cleanup owned CI modules
        if: ${{ always() && steps.ci_modules.outputs.module-root != '' }}
        uses: ./.powershell-ci/actions/cleanup-ps-modules
        with:
          module-root: ${{ steps.ci_modules.outputs.module-root }}

  codescene-coverage-gates:
    runs-on: ${{ inputs.runner }}
    needs: test-and-coverage
    if: ${{ inputs.codescene-enabled && needs.test-and-coverage.result == 'success' && github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check out powershell-ci actions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .powershell-ci
          sparse-checkout: actions
          persist-credentials: false

      - name: Keep powershell-ci actions out of project changes
        run: Add-Content -LiteralPath (Join-Path (git rev-parse --git-dir) "info/exclude") -Value "/.powershell-ci/"

      - name: Download CI artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact-name }}
          path: coverage/

      - name: Check coverage gates in CodeScene
        uses: ./.powershell-ci/actions/check-coverage
        with:
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
          project-url: ${{ format('{0}/v2/projects/{1}', vars.CS_URL, vars.CS_PROJECT_ID) }}
          coverage-files: ${{ inputs.coverage-files }}

  codescene-analysis:
    runs-on: ${{ inputs.runner }}
    needs: test-and-coverage
    if: >-
      ${{
        inputs.codescene-enabled &&
        needs.test-and-coverage.result == 'success' &&
        (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref_name == inputs.codescene-analysis-branch))
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check out powershell-ci actions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .powershell-ci
          sparse-checkout: actions
          persist-credentials: false

      - name: Keep powershell-ci actions out of project changes
        run: Add-Content -LiteralPath (Join-Path (git rev-parse --git-dir) "info/exclude") -Value "/.powershell-ci/"

      - name: Download CI artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact-name }}
          path: .

      - name: Upload coverage to CodeScene and trigger analysis
        if: ${{ inputs.codescene-analysis-command == '' }}
        uses: ./.powershell-ci/actions/codescene-analysis
        with:
          url: ${{ vars.CS_URL }}
          project-id: ${{ vars.CS_PROJECT_ID }}
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}

      - name: Install CodeScene coverage CLI (custom command)
        if: ${{ inputs.codescene-analysis-command != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o install-cs-coverage-tool.sh https://downloads.codescene.io/enterprise/cli/install-cs-coverage-tool.sh
          bash install-cs-coverage-tool.sh -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Upload coverage to CodeScene and trigger analysis (custom command)
        if: ${{ inputs.codescene-analysis-command != '' }}
        shell: pwsh
        env:
          CS_URL: ${{ vars.CS_URL }}
          CS_PROJECT_ID: ${{ vars.CS_PROJECT_ID }}
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        run: |
          if ($env:POWERSHELL_CI_BOOTSTRAP) {
            . $env:POWERSHELL_CI_BOOTSTRAP
            Initialize-CiDependencyEnvironment
          }
          ${{ inputs.codescene-analysis-command }}
