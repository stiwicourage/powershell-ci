name: Feature request
description: Suggest an enhancement to a reusable workflow, action or script.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you need to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: New input, output or behavior, and whether existing callers stay unaffected.
    validations:
      required: true
