name: Create GitHub release
description: Create a GitHub release for an existing tag, using a release-notes file or a default message.

inputs:
  tag-name:
    description: Existing tag to release. Versions with a hyphen become prereleases.
    required: true
  notes-file:
    description: Markdown file with the release text. Empty, missing or blank uses "Version <tag> has been released."
    required: false
    default: ''
  token:
    description: Token with contents write permission.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        TAG_NAME: ${{ inputs.tag-name }}
        NOTES_FILE: ${{ inputs.notes-file }}
      run: |
        & "${{ github.action_path }}/Publish-GitHubRelease.ps1" -TagName $env:TAG_NAME -NotesFile $env:NOTES_FILE
