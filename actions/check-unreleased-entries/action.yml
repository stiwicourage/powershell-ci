name: Check Unreleased Entries
description: Fail when a changelog or release-note file has no entries under [Unreleased], which would stop the release.

inputs:
  files:
    description: Space separated project-relative changelog files that must have entries under [Unreleased].
    required: false
    default: ./CHANGELOG.md

runs:
  using: composite
  steps:
    - name: Check [Unreleased] entries
      shell: pwsh
      env:
        FILES: ${{ inputs.files }}
      run: |
        & "${{ github.action_path }}/Test-UnreleasedEntries.ps1" -Path @($env:FILES -split '\s+' | Where-Object { $_ })
