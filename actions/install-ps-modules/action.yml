name: Install PowerShell modules
description: Install PowerShell modules from a repository, registering PSGallery first when the runner has no registration.

inputs:
  modules:
    description: Space or comma separated module names.
    required: false
    default: ''
  project-file:
    description: Nova project.json whose Manifest.RequiredModules are installed too. Empty or missing file skips it.
    required: false
    default: project.json
  repository:
    description: Repository to install from.
    required: false
    default: PSGallery
  allow-prerelease:
    description: Allow prerelease module versions.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - shell: pwsh
      env:
        MODULES: ${{ inputs.modules }}
        PROJECT_FILE: ${{ inputs.project-file }}
        REPOSITORY: ${{ inputs.repository }}
        ALLOW_PRERELEASE: ${{ inputs.allow-prerelease }}
      run: |
        $ErrorActionPreference = 'Stop'
        if (-not (Get-PSRepository -Name $env:REPOSITORY -ErrorAction SilentlyContinue)) {
          if ($env:REPOSITORY -ne 'PSGallery') {
            throw "PowerShell repository '$($env:REPOSITORY)' is not registered."
          }
          Register-PSRepository -Default
        }
        Set-PSRepository -Name $env:REPOSITORY -InstallationPolicy Trusted

        $installArguments = @{
          Repository = $env:REPOSITORY
          Scope = 'CurrentUser'
          Force = $true
          ErrorAction = 'Stop'
        }
        if ($env:ALLOW_PRERELEASE -eq 'true') { $installArguments.AllowPrerelease = $true }

        $names = @($env:MODULES -split '[\s,]+' | Where-Object { $_ })
        if ($env:PROJECT_FILE -and (Test-Path -LiteralPath $env:PROJECT_FILE)) {
          $project = Get-Content -LiteralPath $env:PROJECT_FILE -Raw | ConvertFrom-Json
          $names += @($project.Manifest.RequiredModules | ForEach-Object { if ($_ -is [string]) { $_ } else { $_.ModuleName } })
        }

        foreach ($name in $names | Where-Object { $_ } | Select-Object -Unique) {
          Write-Output "Installing PowerShell module '$name'..."
          Install-Module -Name $name @installArguments
          $installed = Get-InstalledModule -Name $name | Sort-Object Version -Descending | Select-Object -First 1
          Write-Output "Installed '$($installed.Name)' $($installed.Version) from '$($installed.Repository)'."
        }
