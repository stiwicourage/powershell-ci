name: Install PowerShell modules
description: Install PowerShell modules from a repository, registering PSGallery first when the runner has no registration.

inputs:
  modules:
    description: Space or comma separated module names.
    required: false
    default: ''
  project-file:
    description: Nova project.json whose Manifest.RequiredModules are installed too. Empty or missing file skips it.
    required: false
    default: project.json
  repository:
    description: Repository to install from.
    required: false
    default: PSGallery
  allow-prerelease:
    description: Allow prerelease module versions.
    required: false
    default: 'true'
  dependency-mode:
    description: legacy installs CurrentUser; isolated saves into an owned temporary root.
    required: false
    default: legacy
  pester-required-version:
    description: Exact Pester version in isolated mode; empty preserves project requirements.
    required: false
    default: ''
  script-analyzer-required-version:
    description: Existing analyzer version requirement saved exactly in isolated mode.
    required: false
    default: ''

outputs:
  module-root:
    description: Owned disposable root, empty in legacy mode.
    value: ${{ steps.install.outputs.module-root }}
  module-path:
    description: Isolated module discovery path including native PSHOME modules.
    value: ${{ steps.install.outputs.module-path }}

runs:
  using: composite
  steps:
    - id: install
      shell: pwsh
      env:
        MODULES: ${{ inputs.modules }}
        PROJECT_FILE: ${{ inputs.project-file }}
        REPOSITORY: ${{ inputs.repository }}
        ALLOW_PRERELEASE: ${{ inputs.allow-prerelease }}
        DEPENDENCY_MODE: ${{ inputs.dependency-mode }}
        PESTER_REQUIRED_VERSION: ${{ inputs.pester-required-version }}
        SCRIPT_ANALYZER_REQUIRED_VERSION: ${{ inputs.script-analyzer-required-version }}
      run: |
        $ErrorActionPreference = 'Stop'
        & "${{ github.action_path }}/Install-CiModules.ps1" `
          -Modules @($env:MODULES -split '[\s,]+' | Where-Object { $_ }) `
          -ProjectFile $env:PROJECT_FILE -Repository $env:REPOSITORY `
          -AllowPrerelease ($env:ALLOW_PRERELEASE -eq 'true') `
          -DependencyMode $env:DEPENDENCY_MODE -PesterRequiredVersion $env:PESTER_REQUIRED_VERSION `
          -ScriptAnalyzerRequiredVersion $env:SCRIPT_ANALYZER_REQUIRED_VERSION
